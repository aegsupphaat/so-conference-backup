<script>

// ==========================================
// CONFIGURATION
// ==========================================

const scriptURL =
"https://script.google.com/macros/s/AKfycbxrsV8aaiPuCaCah4HgEnCxFI-LMlcZcoOeHFDwt7jTB_GuJ-ZX4itn5tclNVSlKEn8/exec";

let globalEmployeeData = [];
let selectedRowIndex = null;
let isSavingOnBus = false;


// ==========================================
// MEETING DATE CONFIGURATION
// ==========================================

// รูปแบบวันที่ YYYY-MM-DD
// เว้นว่างไว้ ('') = ปุ่ม Disabled

const MEETING_1_DATE = "2026-11-25";
const MEETING_1_TIME = "11:50:00";

const MEETING_2_DATE = "2026-11-26";
const MEETING_2_TIME = "06:50:00";


// ตัวอย่างการกำหนดวันที่เพื่อเปิดใช้งานปุ่ม
//
// const MEETING_1_DATE = '2026-11-10';
// const MEETING_2_DATE = '2026-11-15';


// ==========================================
// LOAD GOOGLE SHEET DATA
// ==========================================

window.addEventListener('DOMContentLoaded', () => {

    const errorDiv = document.getElementById('error');

    errorDiv.textContent = 'กำลังโหลดฐานข้อมูลจากระบบ...';
    errorDiv.style.color = '#555';

    fetch(scriptURL)

        .then(response => response.json())

        .then(response => {

            if (response.status === 'success') {

                globalEmployeeData = response.data;

                errorDiv.textContent = 'ระบบพร้อมใช้งาน';
                errorDiv.style.color = 'green';

            } else {

                errorDiv.textContent =
                    'ไม่สามารถโหลดข้อมูลได้: ' + response.message;

                errorDiv.style.color = 'red';
            }

        })

        .catch(err => {

            errorDiv.textContent =
                'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';

            errorDiv.style.color = 'red';

            console.error(err);

        });

});


// ==========================================
// HTML ESCAPE
// ==========================================

function escapeHtml(value) {

    return String(value ?? '-').replace(/[&<>"']/g, function(char) {

        const entities = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        };

        return entities[char];

    });

}


// ==========================================
// SEARCH EMPLOYEE
// ==========================================
function isMeetingEnabled(meetingDate, meetingTime) {

    // ตรวจสอบรูปแบบวันที่และเวลา
    if (
        !/^\d{4}-\d{2}-\d{2}$/.test(meetingDate) ||
        !/^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$/.test(meetingTime)
    ) {
        return false;
    }

    // เวลาปัจจุบันประเทศไทย
    const now = new Date();

    const bangkokNow = new Date(
        now.toLocaleString('en-US', {
            timeZone: 'Asia/Bangkok'
        })
    );

    const currentDateTime =
        bangkokNow.getFullYear() + '-' +
        String(bangkokNow.getMonth() + 1).padStart(2, '0') + '-' +
        String(bangkokNow.getDate()).padStart(2, '0') + ' ' +
        String(bangkokNow.getHours()).padStart(2, '0') + ':' +
        String(bangkokNow.getMinutes()).padStart(2, '0') + ':' +
        String(bangkokNow.getSeconds()).padStart(2, '0');

    const meetingDateTime = meetingDate + ' ' + meetingTime;

    // ต้องเป็นวันเดียวกัน และถึงเวลาที่กำหนดแล้ว
    return (
        currentDateTime >= meetingDateTime &&
        currentDateTime.substring(0, 10) === meetingDate
    );
}

function searchData() {

    const fnameInput = document.getElementById('username');
    const lnameInput = document.getElementById('lastname');

    const fname = fnameInput.value.trim().toLowerCase();
    const lname = lnameInput.value.trim().toLowerCase();

    const infoContainer =
        document.getElementById('infoDisplayContainer');

    const errorDiv = document.getElementById('error');

    infoContainer.innerHTML = '';

    errorDiv.textContent = '';

    clearErrors(fnameInput);
    clearErrors(lnameInput);

    let hasError = false;

    if (fname === '') {
        showError(fnameInput, 'กรุณากรอก ชื่อ');
        hasError = true;
    }

    if (lname === '') {
        showError(lnameInput, 'กรุณากรอก นามสกุล');
        hasError = true;
    }

    if (hasError) return;


    // ตรวจสอบว่าข้อมูลโหลดเสร็จแล้วหรือยัง

    if (globalEmployeeData.length === 0) {

        errorDiv.textContent =
            'กรุณารอสักครู่ ระบบกำลังโหลดข้อมูล';

        errorDiv.style.color = 'red';

        return;
    }


    errorDiv.textContent = 'กำลังค้นหาข้อมูล...';
    errorDiv.style.color = '#555';


    let foundRecord = null;


    // SEARCH DATA

    for (let i = 0; i < globalEmployeeData.length; i++) {

        const person = globalEmployeeData[i];

        const keys = Object.keys(person);

        /*
        const fnameKey =
            keys.find(k => k.trim().toLowerCase() === 'firstname')
            || 'FirstName';

        const lnameKey =
            keys.find(k => k.trim().toLowerCase() === 'lastname')
            || 'LastName';
        */
       
        const fullNameKey =
            keys.find(k => k.trim().toLowerCase() === 'name')
            || 'Name';

        const roomKey =
            keys.find(k => k.trim().toLowerCase() === 'room no.')
            || 'Room No.';

        const outboundBusKey =
            keys.find(k => k.trim().toLowerCase() === 'outbound bus')
            || 'Outbound bus';

        const inboundBusKey =
            keys.find(k => k.trim().toLowerCase() === 'inbound bus')
            || 'Inbound bus';

        const dropoffPointKey =
            keys.find(k => k.trim().toLowerCase() === 'drop-off point')
            || 'Drop-off point';

const onBusKey = keys.find(k => k.trim().toLowerCase() === 'check-in') || 'Check-in';


const sheetFullName =
    String(person[fullNameKey] || '').trim().toLowerCase();

if (
    sheetFullName === (fname + ' ' + lname)
) {

        foundRecord = {
            fullName: person[fullNameKey],
            room: person[roomKey],
            outboundbus: person[outboundBusKey],
            inboundbus: person[inboundBusKey],
            dropoffPoint: person[dropoffPointKey],
            onBus: person[onBusKey],
          meeting1: person[keys.find(k =>
              k.trim().toLowerCase() === 'seminar check-in 1'
          ) || 'Seminar Check-in 1'],
          meeting2: person[keys.find(k =>
              k.trim().toLowerCase() === 'seminar check-in 2'
          ) || 'Seminar Check-in 2']
};

            selectedRowIndex = i + 2;

            break;
        }

    }


    // ======================================
    // FOUND RECORD
    // ======================================

    if (foundRecord) {

        errorDiv.textContent = '';

        // ตรวจสอบวันที่ Meeting

const now = new Date();

const meeting1Start = new Date(
    MEETING_1_DATE + 'T' + MEETING_1_TIME + '+07:00'
);

const meeting2Start = new Date(
    MEETING_2_DATE + 'T' + MEETING_2_TIME + '+07:00'
);

// Seminar 1
const meeting1Enabled =
    now >= meeting1Start &&
    now < meeting2Start &&
    !foundRecord.meeting1;

// Seminar 2
const meeting2Enabled =
    now >= meeting2Start &&
    !foundRecord.meeting2;

        // สร้าง Result Card

        const cardHtml = `

            <div class="result-card">

                <div class="result-item">
                    <span class="result-label">ชื่อ-สกุล :</span>
                    <span class="result-value">
                        ${escapeHtml(foundRecord.fullName)}
                    </span>
                </div>

                <div class="result-item">
                    <span class="result-label">เลขที่ห้อง :</span>
                    <span class="result-value">
                        ${escapeHtml(foundRecord.room)}
                    </span>
                </div>

                <div class="result-item">
                    <span class="result-label">รถบัสขาไป :</span>
                    <span class="result-value">
                        ${escapeHtml(foundRecord.outboundbus)}
                    </span>
                </div>

                <div class="result-item">
                    <span class="result-label">รถบัสขากลับ :</span>
                    <span class="result-value">
                        ${escapeHtml(foundRecord.inboundbus)}
                    </span>
                </div>

                <div class="result-item">
                    <span class="result-label">จุดลงรถขากลับ :</span>
                    <span class="result-value">
                        ${escapeHtml(foundRecord.dropoffPoint)}
                    </span>
                </div>


                <!-- MEETING BUTTONS -->

<div class="meeting-buttons">

    <div class="meeting-group">

        <button
            type="button"
            id="btnMeeting1"
            class="meeting-button"
            onclick="submitMeeting('Meeting1')"
            ${meeting1Enabled ? '' : 'disabled'}
        >
            <span class="meeting-button-text">Seminar Check-in 1</span>
        </button>

<div class="meeting-date">
    ${MEETING_1_DATE
        ? MEETING_1_DATE + ' ' + MEETING_1_TIME
        : 'ยังไม่กำหนดวันที่'}
</div>

    </div>

    <div class="meeting-group">

        <button
            type="button"
            id="btnMeeting2"
            class="meeting-button"
            onclick="submitMeeting('Meeting2')"
            ${meeting2Enabled ? '' : 'disabled'}
        >
            <span class="meeting-button-text">Seminar Check-in 2</span>
        </button>

<div class="meeting-date">
    ${MEETING_2_DATE
        ? MEETING_2_DATE + ' ' + MEETING_2_TIME
        : 'ยังไม่กำหนดวันที่'}
</div>

    </div>

</div>

            </div>

        `;


        infoContainer.innerHTML = cardHtml;


        // SWITCH PAGE

        document.getElementById('page-input')
            .classList.add('hidden');

        document.getElementById('page-output')
            .classList.remove('hidden');


        // SAVE ONBUS IMMEDIATELY

const onBusValue = String(foundRecord.onBus ?? '').trim();

if (onBusValue === '') {
    markOnBus();
} else {
    errorDiv.textContent = '';
}

    }

    // ======================================
    // NOT FOUND
    // ======================================

    else {

        errorDiv.textContent =
            'ไม่พบข้อมูลบุคคลนี้ในระบบ';

        errorDiv.style.color = 'red';

        selectedRowIndex = null;

    }

}


// ==========================================
// SAVE OnBus TO GOOGLE SHEET
// ==========================================

function markOnBus() {

    if (!selectedRowIndex || isSavingOnBus) return;

    isSavingOnBus = true;

    const errorDiv = document.getElementById('error');

    errorDiv.textContent =
        'กำลังบันทึกสถานะ Check-in...';

    errorDiv.style.color = '#555';


    fetch(scriptURL, {

        method: 'POST',

        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },

        body: new URLSearchParams({

            action: 'markOnBus',
            rowIndex: selectedRowIndex

        })

    })

    .then(response => response.json())

    .then(result => {

        if (result.status === 'success') {

            errorDiv.textContent =
                'Check-in เรียบร้อยแล้ว ✓';

            errorDiv.style.color = 'green';

        } else {

            errorDiv.textContent =
                'บันทึกไม่สำเร็จ: ' + result.message;

            errorDiv.style.color = 'red';

        }

    })

    .catch(error => {

        errorDiv.textContent =
            'เกิดข้อผิดพลาดในการบันทึก Check-in';

        errorDiv.style.color = 'red';

        console.error(error);

    })

    .finally(() => {

        isSavingOnBus = false;

    });

}


function submitMeeting(meetingName) {

    if (!selectedRowIndex) return;

    if (!['Meeting1', 'Meeting2'].includes(meetingName)) {
        return;
    }

    const now = new Date();

    const meeting1Start = new Date(
        MEETING_1_DATE + 'T' + MEETING_1_TIME + '+07:00'
    );

    const meeting2Start = new Date(
        MEETING_2_DATE + 'T' + MEETING_2_TIME + '+07:00'
    );

    // ตรวจสอบเวลาของแต่ละ Seminar
    if (meetingName === 'Meeting1') {
        if (now < meeting1Start || now >= meeting2Start) {
            return;
        }
    }

    if (meetingName === 'Meeting2') {
        if (now < meeting2Start) {
            return;
        }
    }

    const buttonId = meetingName === 'Meeting1'
        ? 'btnMeeting1'
        : 'btnMeeting2';

    const button = document.getElementById(buttonId);
    const errorDiv = document.getElementById('error');

    if (!button || button.disabled) return;

    const originalText = meetingName === 'Meeting1'
        ? 'Seminar Check-in 1'
        : 'Seminar Check-in 2';

    button.disabled = true;
    button.textContent = 'กำลังบันทึก...';

    errorDiv.textContent = 'กำลังบันทึก ' + originalText;
    errorDiv.style.color = '#555';

    fetch(scriptURL, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: new URLSearchParams({
            action: 'markMeeting',
            meetingName: meetingName,
            rowIndex: selectedRowIndex
        })
    })

    .then(response => response.json())

    .then(result => {

        if (
            result.status === 'success' ||
            result.status === 'already_stamped'
        ) {

            button.disabled = true;

            button.innerHTML =
                '<span class="meeting-button-text">✓ ' +
                originalText +
                '</span>';

            errorDiv.textContent =
                result.status === 'success'
                    ? 'บันทึก ' + originalText + ' สำเร็จ: ' + result.date
                    : originalText + ' มีการบันทึกไปแล้ว';

            errorDiv.style.color = 'green';

        } else {

            button.disabled = false;
            button.textContent = originalText;

            errorDiv.textContent =
                'บันทึกไม่สำเร็จ: ' + result.message;

            errorDiv.style.color = 'red';
        }

    })

    .catch(error => {

        button.disabled = false;
        button.textContent = originalText;

        errorDiv.textContent =
            'เกิดข้อผิดพลาดในการบันทึก กรุณาลองใหม่';

        errorDiv.style.color = 'red';

        console.error(error);

    });

}

// ==========================================
// VALIDATION
// ==========================================

function showError(input, message) {

    const formControl = input.parentElement;

    formControl.className = 'form-control error';

    const small = formControl.querySelector('small');

    if (small) {

        small.innerText = message;
        small.style.color = 'red';

    }

}


function clearErrors(input) {

    const formControl = input.parentElement;

    formControl.className = 'form-control';

    const small = formControl.querySelector('small');

    if (small) {

        small.innerText = '';

    }

}
